server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ad.luxe-pack.biz;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    ssl_certificate /etc/letsencrypt/live/admin.luxe-pack.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.luxe-pack.biz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /admin/ { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /webhooks/ { return 404; }
    location ^~ /agency/api/v2/ {
        proxy_pass http://127.0.0.1:8611;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ad.luxe-pack.biz;
    return 301 https://$host$request_uri;
}
