name: OLD Test Protected Main Artifact

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Approved OLD Test artifact task
        required: true
        type: string
      pr_number:
        description: Merged application source PR
        required: true
        type: number
      source_sha:
        description: Exact approved protected-main payload SHA
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: old-test-main-artifact-${{ inputs.task_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  old-test-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the protected-main control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact merged OLD Test source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 control/scripts/ops/old_test_source_authority.py

      - name: Check out the exact approved application payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: payload
          fetch-depth: 1
          persist-credentials: false

      - name: Build and verify OLD Test AMD64 API artifact
        working-directory: payload
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
          helper="$GITHUB_WORKSPACE/control/scripts/ops/preview_image_artifact.py"
          python3 "$helper" host-check --architecture amd64
          command -v zstd >/dev/null
          created_at="$(git show -s --format=%cI "$INPUT_SOURCE_SHA")"
          api_image="oripa-v2-api:old-test-${INPUT_TASK_ID}-${INPUT_SOURCE_SHA:0:12}"
          docker build --platform linux/amd64 --target preview \
            --build-arg "OCI_VERSION=old-test-${INPUT_TASK_ID}" \
            --build-arg "OCI_REVISION=${INPUT_SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file infra/docker/backend/Dockerfile --tag "$api_image" .
          python3 "$helper" package \
            --output "$RUNNER_TEMP/old-test-images" \
            --task-id "$INPUT_TASK_ID" --pr-number "$INPUT_PR_NUMBER" \
            --source-sha "$INPUT_SOURCE_SHA" --created-at "$created_at" \
            --artifact-kind old-test --architecture amd64 \
            --image-mode api-only --api-image "$api_image"
          python3 "$helper" verify \
            --directory "$RUNNER_TEMP/old-test-images" \
            --task-id "$INPUT_TASK_ID" --pr-number "$INPUT_PR_NUMBER" \
            --source-sha "$INPUT_SOURCE_SHA" --artifact-kind old-test --architecture amd64
          cp "$RUNNER_TEMP/source-authority.json" "$RUNNER_TEMP/old-test-images/source-authority.json"

      - name: Upload verified OLD Test artifact and authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-old-test-images-${{ inputs.task_id }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/old-test-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
