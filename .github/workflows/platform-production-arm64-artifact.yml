name: Platform Production ARM64 Artifact

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Merged Change ID
        required: true
        type: string
      pr_number:
        description: Merged internal pull request number
        required: true
        type: number
      source_sha:
        description: Exact Human-approved Runtime Source SHA (never inferred from main)
        required: true
        type: string
      public_origin:
        description: Production public HTTPS origin (V2_PUBLIC_ORIGIN)
        required: true
        type: string
      admin_origin:
        description: Production Admin HTTPS origin (V2_ADMIN_ORIGIN)
        required: true
        type: string
      agency_origin:
        description: Production Agency HTTPS origin (V2_AGENCY_ORIGIN)
        required: true
        type: string
      agency_login_url:
        description: Production Agency HTTPS login URL (V2_AGENCY_LOGIN_URL)
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: platform-production-arm64-artifact-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-production-candidate-arm64:
    name: build-production-candidate-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Check out current protected workflow authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: build-authority
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Human-approved source and current policy authority
        id: authority
        working-directory: build-authority
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANGE_ID: ${{ inputs.change_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/ci/policy_gate.py --repository .
          python3 scripts/ops/production_source_authority.py --repository .

      - name: Check out exact approved Runtime Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify native ARM64 build authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.authority.outputs.source_sha }}"
          python3 "$GITHUB_WORKSPACE/build-authority/scripts/ops/production_source_authority.py" --repository . --scan-source
          test "$(uname -m)" = "aarch64"
          python3 scripts/ops/preview_image_artifact.py host-check --architecture arm64
          command -v zstd >/dev/null

      - name: Build, package, verify, and load candidate
        env:
          CHANGE_ID: ${{ steps.authority.outputs.change_id }}
          PR_NUMBER: ${{ steps.authority.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          V2_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
          V2_ADMIN_ORIGIN: ${{ inputs.admin_origin }}
          V2_AGENCY_ORIGIN: ${{ inputs.agency_origin }}
          V2_AGENCY_LOGIN_URL: ${{ inputs.agency_login_url }}
        run: |
          created_at="$(git show -s --format=%cI "$SOURCE_SHA")"
          target_platform="$(python3 scripts/ops/preview_image_artifact.py target --architecture arm64 --field platform)"
          api_image="oripa-v2-api:production-candidate-${CHANGE_ID}-${SOURCE_SHA:0:12}-arm64"
          admin_image="oripa-v2-admin:production-candidate-${CHANGE_ID}-${SOURCE_SHA:0:12}-arm64"
          agency_image="oripa-v2-agency:production-candidate-${CHANGE_ID}-${SOURCE_SHA:0:12}-arm64"
          docker build --platform "$target_platform" \
            --target production \
            --build-arg "OCI_VERSION=production-candidate-${CHANGE_ID}" \
            --build-arg "OCI_REVISION=${SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file infra/docker/backend/Dockerfile \
            --tag "$api_image" .
          docker build --platform "$target_platform" \
            --target production \
            --build-arg "OCI_VERSION=production-candidate-${CHANGE_ID}" \
            --build-arg "OCI_REVISION=${SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file apps/admin/Dockerfile \
            --tag "$admin_image" .
          docker build --platform "$target_platform" \
            --target production \
            --build-arg "OCI_VERSION=production-candidate-${CHANGE_ID}" \
            --build-arg "OCI_REVISION=${SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file apps/agency/Dockerfile \
            --tag "$agency_image" .
          python3 scripts/ops/agency_production_readiness.py \
            --source-sha "$SOURCE_SHA" \
            --evidence "$RUNNER_TEMP/production-readiness.json" \
            --api-image "$api_image" \
            --admin-image "$admin_image" \
            --agency-image "$agency_image"
          python3 scripts/ops/preview_image_artifact.py package \
            --output "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --created-at "$created_at" \
            --image-mode agency \
            --artifact-kind production-candidate \
            --architecture arm64 \
            --api-image "$api_image" \
            --admin-image "$admin_image" \
            --agency-image "$agency_image"
          python3 scripts/ops/preview_image_artifact.py verify \
            --directory "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --artifact-kind production-candidate \
            --architecture arm64
          python3 scripts/ops/preview_image_artifact.py load \
            --directory "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --artifact-kind production-candidate \
            --architecture arm64

      - name: Include effective domain validation evidence
        run: |
          cp "$RUNNER_TEMP/production-readiness.json" "$RUNNER_TEMP/platform-production-arm64/production-readiness.json"
          cp "$RUNNER_TEMP/production-source-authority.json" "$RUNNER_TEMP/platform-production-arm64/production-source-authority.json"

      - name: Upload immutable Production candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-platform-production-candidate-${{ steps.authority.outputs.source_sha }}-linux-arm64
          path: ${{ runner.temp }}/platform-production-arm64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
