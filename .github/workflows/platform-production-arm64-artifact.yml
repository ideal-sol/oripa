name: Platform Production ARM64 Artifact

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Merged Change ID
        required: true
        type: string
      pr_number:
        description: Merged internal pull request number
        required: true
        type: number
      source_sha:
        description: Exact protected main merge SHA
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: platform-production-arm64-artifact-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-production-candidate-arm64:
    name: build-production-candidate-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Validate exact merged main authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANGE_ID: ${{ inputs.change_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["INPUT_REPOSITORY"]
          change_id = os.environ["INPUT_CHANGE_ID"]
          pr_number = os.environ["INPUT_PR_NUMBER"]
          source_sha = os.environ["INPUT_SOURCE_SHA"]
          if repository != "ideal-sol/oripa":
              raise SystemExit("repository mismatch")
          if not re.fullmatch(r"[A-Z][A-Z0-9-]{2,31}", change_id):
              raise SystemExit("invalid Change ID")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", pr_number):
              raise SystemExit("invalid PR number")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("invalid source SHA")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "oripa-platform-production-arm64-artifact/1.0",
          }

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}", headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
                  raise SystemExit("GitHub authority lookup failed") from error

          main_ref = get("git/ref/heads/main")
          if (main_ref.get("object") or {}).get("sha") != source_sha:
              raise SystemExit("source SHA is not current protected main")
          pull = get(f"pulls/{pr_number}")
          if (
              pull.get("merged") is not True
              or pull.get("merge_commit_sha") != source_sha
              or (pull.get("base") or {}).get("ref") != "main"
              or ((pull.get("head") or {}).get("repo") or {}).get("full_name") != repository
              or change_id not in str(pull.get("title", ""))
          ):
              raise SystemExit("merged pull request authority mismatch")

          checks = get(f"commits/{source_sha}/check-runs?per_page=100")
          latest = {}
          for check in checks.get("check_runs", []):
              name = check.get("name")
              identifier = check.get("id")
              if isinstance(name, str) and isinstance(identifier, int):
                  current = latest.get(name)
                  if current is None or identifier > current.get("id", 0):
                      latest[name] = check
          required = {
              "policy-gate",
              "quality-gate",
              "security-gate",
              "integration-gate",
              "ci-gate",
          }
          failed = sorted(
              name
              for name in required
              if (latest.get(name) or {}).get("status") != "completed"
              or (latest.get(name) or {}).get("conclusion") != "success"
          )
          if failed:
              raise SystemExit("required checks not successful: " + ", ".join(failed))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"change_id={change_id}\n")
              output.write(f"pr_number={pr_number}\n")
              output.write(f"source_sha={source_sha}\n")
          PY

      - name: Check out exact protected main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify native ARM64 build authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.authority.outputs.source_sha }}"
          test "$(uname -m)" = "aarch64"
          python3 scripts/ops/preview_image_artifact.py host-check --architecture arm64
          command -v zstd >/dev/null

      - name: Build, package, verify, and load candidate
        env:
          CHANGE_ID: ${{ steps.authority.outputs.change_id }}
          PR_NUMBER: ${{ steps.authority.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
        run: |
          created_at="$(git show -s --format=%cI "$SOURCE_SHA")"
          target_platform="$(python3 scripts/ops/preview_image_artifact.py target --architecture arm64 --field platform)"
          api_image="oripa-v2-api:production-candidate-${CHANGE_ID}-${SOURCE_SHA:0:12}-arm64"
          admin_image="oripa-v2-admin:production-candidate-${CHANGE_ID}-${SOURCE_SHA:0:12}-arm64"
          docker build --platform "$target_platform" \
            --target production \
            --build-arg "OCI_VERSION=production-candidate-${CHANGE_ID}" \
            --build-arg "OCI_REVISION=${SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file infra/docker/backend/Dockerfile \
            --tag "$api_image" .
          docker build --platform "$target_platform" \
            --target production \
            --build-arg "OCI_VERSION=production-candidate-${CHANGE_ID}" \
            --build-arg "OCI_REVISION=${SOURCE_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file apps/admin/Dockerfile \
            --tag "$admin_image" .
          python3 scripts/ops/preview_image_artifact.py package \
            --output "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --created-at "$created_at" \
            --image-mode normal \
            --artifact-kind production-candidate \
            --architecture arm64 \
            --api-image "$api_image" \
            --admin-image "$admin_image"
          python3 scripts/ops/preview_image_artifact.py verify \
            --directory "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --artifact-kind production-candidate \
            --architecture arm64
          python3 scripts/ops/preview_image_artifact.py load \
            --directory "$RUNNER_TEMP/platform-production-arm64" \
            --task-id "$CHANGE_ID" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" \
            --artifact-kind production-candidate \
            --architecture arm64

      - name: Upload immutable Production candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-platform-production-candidate-${{ steps.authority.outputs.source_sha }}-linux-arm64
          path: ${{ runner.temp }}/platform-production-arm64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
