name: Production Readiness Shadow Observation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: readiness-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness-shadow:
    name: readiness-shadow-observation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify consumer implementation
        run: python3 -m unittest tests.release.test_readiness
      - name: Record observation without Production handoff
        run: >-
          python3 -m scripts.release.readiness
          --input tests/release/fixtures/readiness-no-handoff.json
          --output "$RUNNER_TEMP/readiness-shadow.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readiness-shadow-observation
          path: ${{ runner.temp }}/readiness-shadow.json
          retention-days: 7
