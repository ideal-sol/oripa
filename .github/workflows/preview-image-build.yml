name: Preview Image Build

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Approved task ID
        required: true
        type: string
      pr_number:
        description: Open internal pull request number
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: preview-image-build-${{ inputs.task_id }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  build-preview-images:
    name: build-preview-images-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate the approved internal PR head
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["INPUT_REPOSITORY"]
          task_id = os.environ["INPUT_TASK_ID"]
          pr_number = os.environ["INPUT_PR_NUMBER"]
          head_sha = os.environ["INPUT_HEAD_SHA"]
          if repository != "ideal-sol/oripa":
              raise SystemExit("repository mismatch")
          if not re.fullmatch(r"[A-Z][A-Z0-9-]{2,31}", task_id):
              raise SystemExit("invalid task ID")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", pr_number):
              raise SystemExit("invalid PR number")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("invalid head SHA")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/pulls/{pr_number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oripa-preview-image-build/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pull = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              raise SystemExit("pull request validation failed") from error
          head = pull.get("head") or {}
          base = pull.get("base") or {}
          head_repository = head.get("repo") or {}
          if pull.get("state") != "open":
              raise SystemExit("pull request is not open")
          if head_repository.get("full_name") != repository:
              raise SystemExit("external pull request rejected")
          if head.get("sha") != head_sha:
              raise SystemExit("pull request head mismatch")
          if base.get("ref") != "main":
              raise SystemExit("base branch mismatch")
          if task_id not in str(pull.get("title", "")) or task_id not in str(head.get("ref", "")):
              raise SystemExit("task identity mismatch")
          checks_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{head_sha}/check-runs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oripa-preview-image-build/1.0",
              },
          )
          try:
              with urllib.request.urlopen(checks_request, timeout=30) as response:
                  checks = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              raise SystemExit("required checks lookup failed") from error
          latest = {}
          for check in checks.get("check_runs", []):
              name = check.get("name")
              identifier = check.get("id")
              if isinstance(name, str) and isinstance(identifier, int):
                  current = latest.get(name)
                  if current is None or identifier > current.get("id", 0):
                      latest[name] = check
          required = {"policy-gate", "quality-gate", "security-gate", "integration-gate", "ci-gate"}
          failed = sorted(
              name
              for name in required
              if (latest.get(name) or {}).get("status") != "completed"
              or (latest.get(name) or {}).get("conclusion") != "success"
          )
          if failed:
              raise SystemExit("required checks not successful: " + ", ".join(failed))
          PY

      - name: Check out the exact validated head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and runner architecture
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD_SHA"
          python3 scripts/ops/preview_image_artifact.py host-check
          command -v zstd >/dev/null

      - name: Build immutable target architecture images
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          created_at="$(git show -s --format=%cI "$INPUT_HEAD_SHA")"
          target_platform="$(python3 scripts/ops/preview_image_artifact.py target --field platform)"
          api_image="oripa-v2-api:preview-${INPUT_TASK_ID}-${INPUT_HEAD_SHA:0:12}"
          admin_image="oripa-v2-admin:preview-${INPUT_TASK_ID}-${INPUT_HEAD_SHA:0:12}"
          docker build --platform "$target_platform" \
            --build-arg "OCI_VERSION=preview-${INPUT_TASK_ID}" \
            --build-arg "OCI_REVISION=${INPUT_HEAD_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file infra/docker/backend/Dockerfile \
            --tag "$api_image" .
          docker build --platform "$target_platform" \
            --build-arg "OCI_VERSION=preview-${INPUT_TASK_ID}" \
            --build-arg "OCI_REVISION=${INPUT_HEAD_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file apps/admin/Dockerfile \
            --tag "$admin_image" .
          python3 scripts/ops/preview_image_artifact.py package \
            --output "$RUNNER_TEMP/preview-images" \
            --task-id "$INPUT_TASK_ID" \
            --pr-number "$INPUT_PR_NUMBER" \
            --source-sha "$INPUT_HEAD_SHA" \
            --created-at "$created_at" \
            --api-image "$api_image" \
            --admin-image "$admin_image"
          python3 scripts/ops/preview_image_artifact.py verify \
            --directory "$RUNNER_TEMP/preview-images" \
            --task-id "$INPUT_TASK_ID" \
            --pr-number "$INPUT_PR_NUMBER" \
            --source-sha "$INPUT_HEAD_SHA"

      - name: Upload the verified Preview image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-preview-images-${{ inputs.task_id }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/preview-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Set up Node.js for the Storefront contract artifact
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.3"

      - name: Build and verify the immutable Storefront contract artifact
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD_SHA"
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @oripa/storefront-client build
          pnpm --filter @oripa/site-schema build
          pnpm --filter @oripa/storefront-testkit build
          output="$RUNNER_TEMP/storefront-contract"
          mkdir -p "$output"
          pnpm --filter @oripa/storefront-client pack --pack-destination "$output"
          pnpm --filter @oripa/site-schema pack --pack-destination "$output"
          pnpm --filter @oripa/storefront-testkit pack --pack-destination "$output"
          cp openapi/bundled/public.openapi.json "$output/public.openapi.json"
          OUTPUT_DIRECTORY="$output" python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          output = Path(os.environ["OUTPUT_DIRECTORY"])
          source = os.environ["INPUT_HEAD_SHA"]
          task = os.environ["INPUT_TASK_ID"]
          expected = {
              "@oripa/storefront-client": "oripa-storefront-client",
              "@oripa/storefront-testkit": "oripa-storefront-testkit",
              "@oripa/site-schema": "oripa-site-schema",
          }
          package_rows = []
          version = None
          for name, prefix in expected.items():
              matches = list(output.glob(prefix + "-*.tgz"))
              if len(matches) != 1:
                  raise SystemExit("unexpected package artifact inventory")
              path = matches[0]
              with tarfile.open(path, "r:gz") as archive:
                  member = archive.extractfile("package/package.json")
                  if member is None:
                      raise SystemExit("package manifest missing")
                  package = json.load(member)
              if package.get("name") != name:
                  raise SystemExit("package identity mismatch")
              if version is None:
                  version = package.get("version")
              if package.get("version") != version:
                  raise SystemExit("package version mismatch")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              change = (
                  "package release only; site manifest schema remains 2.0.0-alpha.1"
                  if name == "@oripa/site-schema" else "non-breaking additive"
              )
              package_rows.append({
                  "name": name,
                  "version": version,
                  "file": path.name,
                  "sha256": digest,
                  "browser_compatible": True,
                  "change": change,
              })
          openapi = output / "public.openapi.json"
          openapi_digest = hashlib.sha256(openapi.read_bytes()).hexdigest()
          created = subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", source], text=True
          ).strip()
          generated = dt.datetime.fromisoformat(created).astimezone(dt.timezone.utc)
          manifest = {
              "task_id": task,
              "generated_at": generated.replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "source_commit": source,
              "public_openapi": {
                  "file": openapi.name,
                  "sha256": openapi_digest,
                  "compatibility_family": 2,
                  "breaking_change": False,
              },
              "packages": package_rows,
              "toolchain": {"node": "22.22.3", "pnpm": "10.12.1"},
              "installation": {
                  "registry_publish_performed": False,
                  "workspace_dependency_required": False,
                  "consumer_resolution": "pin all three private package versions to the supplied tarballs; pnpm consumers use overrides for storefront-testkit transitive resolution",
              },
          }
          (output / "artifact-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          checksums = sorted(
              [(row["file"], row["sha256"]) for row in package_rows]
              + [(openapi.name, openapi_digest)]
          )
          (output / "SHA256SUMS").write_text(
              "".join(f"{digest}  {filename}\n" for filename, digest in checksums),
              encoding="ascii",
          )
          PY
          cd "$output"
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Upload the verified Storefront contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-storefront-contract-${{ inputs.task_id }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/storefront-contract/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
