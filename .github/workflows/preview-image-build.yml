name: Preview Image Build

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Approved task ID
        required: true
        type: string
      pr_number:
        description: Open internal pull request number
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      image_mode:
        description: Preview images to build
        required: true
        default: normal
        type: choice
        options:
          - normal
          - api-only

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: preview-image-build-${{ inputs.task_id }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  build-preview-images:
    name: build-preview-images-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate the approved internal PR head
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_IMAGE_MODE: ${{ inputs.image_mode }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["INPUT_REPOSITORY"]
          task_id = os.environ["INPUT_TASK_ID"]
          pr_number = os.environ["INPUT_PR_NUMBER"]
          head_sha = os.environ["INPUT_HEAD_SHA"]
          image_mode = os.environ["INPUT_IMAGE_MODE"]
          if repository != "ideal-sol/oripa":
              raise SystemExit("repository mismatch")
          if not re.fullmatch(r"[A-Z][A-Z0-9-]{2,31}", task_id):
              raise SystemExit("invalid task ID")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", pr_number):
              raise SystemExit("invalid PR number")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("invalid head SHA")
          if image_mode not in {"normal", "api-only"}:
              raise SystemExit("invalid image mode")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/pulls/{pr_number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oripa-preview-image-build/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pull = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              raise SystemExit("pull request validation failed") from error
          head = pull.get("head") or {}
          base = pull.get("base") or {}
          head_repository = head.get("repo") or {}
          state = pull.get("state")
          merge_commit_sha = pull.get("merge_commit_sha")
          merged = (
              state == "closed"
              and pull.get("merged") is True
              and isinstance(merge_commit_sha, str)
              and re.fullmatch(r"[0-9a-f]{40}", merge_commit_sha)
          )
          if state != "open" and not merged:
              raise SystemExit("pull request is neither open nor merged")
          if head_repository.get("full_name") != repository:
              raise SystemExit("external pull request rejected")
          if head.get("sha") != head_sha:
              raise SystemExit("pull request head mismatch")
          if base.get("ref") != "main":
              raise SystemExit("base branch mismatch")
          if task_id not in str(pull.get("title", "")) or task_id not in str(head.get("ref", "")):
              raise SystemExit("task identity mismatch")
          checks_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{head_sha}/check-runs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oripa-preview-image-build/1.0",
              },
          )
          try:
              with urllib.request.urlopen(checks_request, timeout=30) as response:
                  checks = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              raise SystemExit("required checks lookup failed") from error
          latest = {}
          for check in checks.get("check_runs", []):
              name = check.get("name")
              identifier = check.get("id")
              if isinstance(name, str) and isinstance(identifier, int):
                  current = latest.get(name)
                  if current is None or identifier > current.get("id", 0):
                      latest[name] = check
          required = {"policy-gate", "quality-gate", "security-gate", "integration-gate", "ci-gate"}
          failed = sorted(
              name
              for name in required
              if (latest.get(name) or {}).get("status") != "completed"
              or (latest.get(name) or {}).get("conclusion") != "success"
          )
          if failed:
              raise SystemExit("required checks not successful: " + ", ".join(failed))
          PY

      - name: Check out the exact validated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and runner architecture
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD_SHA"
          python3 scripts/ops/preview_image_artifact.py host-check
          command -v zstd >/dev/null

      - name: Build immutable target architecture images
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_IMAGE_MODE: ${{ inputs.image_mode }}
        run: |
          created_at="$(git show -s --format=%cI "$INPUT_HEAD_SHA")"
          target_platform="$(python3 scripts/ops/preview_image_artifact.py target --field platform)"
          api_image="oripa-v2-api:preview-${INPUT_TASK_ID}-${INPUT_HEAD_SHA:0:12}"
          admin_image="oripa-v2-admin:preview-${INPUT_TASK_ID}-${INPUT_HEAD_SHA:0:12}"
          docker build --platform "$target_platform" \
            --build-arg "OCI_VERSION=preview-${INPUT_TASK_ID}" \
            --build-arg "OCI_REVISION=${INPUT_HEAD_SHA}" \
            --build-arg "OCI_CREATED=${created_at}" \
            --file infra/docker/backend/Dockerfile \
            --tag "$api_image" .
          package_arguments=(
            --output "$RUNNER_TEMP/preview-images"
            --task-id "$INPUT_TASK_ID"
            --pr-number "$INPUT_PR_NUMBER"
            --source-sha "$INPUT_HEAD_SHA"
            --created-at "$created_at"
            --image-mode "$INPUT_IMAGE_MODE"
            --api-image "$api_image"
          )
          if [[ "$INPUT_IMAGE_MODE" == "normal" ]]; then
            docker build --platform "$target_platform" \
              --build-arg "OCI_VERSION=preview-${INPUT_TASK_ID}" \
              --build-arg "OCI_REVISION=${INPUT_HEAD_SHA}" \
              --build-arg "OCI_CREATED=${created_at}" \
              --file apps/admin/Dockerfile \
              --tag "$admin_image" .
            package_arguments+=(--admin-image "$admin_image")
          fi
          python3 scripts/ops/preview_image_artifact.py package "${package_arguments[@]}"
          python3 scripts/ops/preview_image_artifact.py verify \
            --directory "$RUNNER_TEMP/preview-images" \
            --task-id "$INPUT_TASK_ID" \
            --pr-number "$INPUT_PR_NUMBER" \
            --source-sha "$INPUT_HEAD_SHA"

      - name: Upload the verified Preview image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oripa-preview-images-${{ inputs.task_id }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/preview-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
