PaymentPaidyAuthorizationRequest:
  type: object
  additionalProperties: false
  required: [paidy_payment_id]
  properties:
    paidy_payment_id:
      type: string
      pattern: '^pay_[A-Za-z0-9_-]{1,124}$'
      maxLength: 128
PaymentPaidyCheckoutAction:
  type: object
  additionalProperties: false
  required: [type, script_url, public_key, payload]
  properties:
    type: {const: paidy_checkout}
    script_url: {const: 'https://apps.paidy.com/'}
    public_key: {type: string, pattern: '^pk_'}
    payload:
      type: object
      additionalProperties: false
      required: [amount, currency, store_name, description, buyer, buyer_data, order]
      properties:
        amount: {type: integer, minimum: 1}
        currency: {const: JPY}
        store_name: {type: string, minLength: 1}
        description: {const: コイン購入}
        buyer:
          type: object
          additionalProperties: false
          required: [email, phone]
          properties:
            email: {type: string, format: email}
            phone: {type: string, pattern: '^0[789]0[0-9]{8}$'}
            name1: {type: string, minLength: 1}
        buyer_data:
          type: object
          additionalProperties: false
          required: [user_id, age, account_registration_date, previous_payment_methods, ltv, order_count, order_count_last3months, order_amount_last3months, number_of_points]
          properties:
            user_id: {type: string, format: uuid}
            age: {type: integer, minimum: 0, description: Days since account registration.}
            account_registration_date: {type: string, format: date, description: Account registration date in Asia/Tokyo.}
            delivery_locn_type: {type: string, minLength: 1}
            days_since_first_transaction: {type: integer, minimum: 0, description: JST calendar days since first eligible purchase.}
            previous_payment_methods:
              type: object
              additionalProperties: false
              required: [credit_card_used]
              properties:
                credit_card_used: {type: boolean}
                convenience_store_prepayment_used: {type: boolean}
                bank_transfer_used: {type: boolean}
            order_item_categories:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
            ltv: {type: integer, minimum: 0}
            order_count: {type: integer, minimum: 0}
            last_order_amount: {type: integer, minimum: 0}
            last_order_at: {type: integer, minimum: 0, description: Days since last eligible purchase.}
            order_count_last3months: {type: integer, minimum: 0}
            order_amount_last3months: {type: integer, minimum: 0}
            number_of_points: {type: integer, minimum: 0}
        order:
          type: object
          additionalProperties: false
          required: [items, order_ref, shipping, tax]
          properties:
            order_ref: {type: string, format: uuid}
            shipping: {const: 0}
            tax: {const: 0}
            items:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [id, title, quantity, unit_price]
                properties:
                  id: {type: string, format: uuid}
                  title: {type: string}
                  quantity: {const: 1}
                  unit_price: {type: integer, minimum: 1}
