openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Public API
  version: 2.0.0-alpha.1
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: Storefront向けPublic API v2の認証Contract Alpha。
  x-status: alpha
x-oripa-surface: public
servers:
  - url: /api/v2
paths:
  /content/banners:
    get:
      operationId: listContentBanners
      summary: 公開期間内のBannerを表示順で取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      responses:
        '200':
          description: 公開Banner一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBannerCollection'
        default:
          $ref: '#/components/responses/Problem'
  /content/notices:
    get:
      operationId: listContentNotices
      summary: 公開期間内のNoticeをCursor順で取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/CatalogCursor'
      responses:
        '200':
          description: 公開Notice一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNoticeCollection'
        default:
          $ref: '#/components/responses/Problem'
  /content/notices/{notice_id}:
    get:
      operationId: getContentNotice
      summary: 公開期間内のNotice詳細を取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: notice_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: 公開Notice詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNotice'
        default:
          $ref: '#/components/responses/Problem'
  /content/pages/{slug}:
    get:
      operationId: getContentStaticPage
      summary: Slugで公開期間内のStatic Pageを取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            maxLength: 128
      responses:
        '200':
          description: 公開Static Page。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStaticPage'
        default:
          $ref: '#/components/responses/Problem'
  /contact-inquiries:
    post:
      operationId: createContactInquiry
      summary: Anonymousまたは認証済みUserが問い合わせを送信する
      x-idempotency: not-supported
      x-rate-limit: ip-5-per-hour-and-email-3-per-hour
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - {}
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactInquiryRequest'
      responses:
        '202':
          description: 問い合わせを受け付けた。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInquiryReceipt'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /gacha-categories:
    get:
      operationId: listGachaCategories
      summary: 公開中GachaのCategoryを取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-300-seconds
      x-stability: alpha
      security: []
      responses:
        '200':
          description: 公開Category一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaCategoryCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gacha-tags:
    get:
      operationId: listGachaTags
      summary: 公開中GachaのTagを取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-300-seconds
      x-stability: alpha
      security: []
      responses:
        '200':
          description: 公開Tag一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaTagCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gachas:
    get:
      operationId: listGachas
      summary: 公開期間内のGachaをCursor順で取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/CatalogCursor'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/TagSlug'
      responses:
        '200':
          description: 公開Gacha一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaSummaryCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gachas/by-slug/{slug}:
    get:
      operationId: getGachaBySlug
      summary: Slugで公開中Gacha詳細を取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            maxLength: 128
      responses:
        '200':
          description: 公開Gacha詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDetailResponse'
        default:
          $ref: '#/components/responses/Problem'
  /gachas/{gacha_id}:
    get:
      operationId: getGacha
      summary: Opaque Public IDで公開中Gacha詳細を取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: gacha_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: 公開Gacha詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDetailResponse'
        default:
          $ref: '#/components/responses/Problem'
  /gachas/{gacha_id}/draws:
    post:
      operationId: createDraw
      summary: 認証済みUserが単一またはBulk Drawを作成する
      x-idempotency: required
      x-rate-limit: user-20-per-minute
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - name: gacha_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDrawRequest'
      responses:
        '200':
          description: Drawを完了した、または同じ結果を再取得した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawResponse'
        default:
          $ref: '#/components/responses/Problem'
  /draw-requests/{draw_request_id}:
    get:
      operationId: getDrawRequest
      summary: Network結果不明時を含む完了済みDraw結果を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - name: draw_request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: User自身の完了済みDraw結果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawResponse'
        default:
          $ref: '#/components/responses/Problem'
  /me/prizes:
    get:
      operationId: listUserPrizes
      summary: User自身が所有する景品を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/CatalogCursor'
      responses:
        '200':
          description: User Prize一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrizeCollection'
        default:
          $ref: '#/components/responses/Problem'
  /me/prizes/{prize_id}:
    get:
      operationId: getUserPrize
      summary: User自身が所有する景品詳細を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/UserPrizeId'
      responses:
        '200':
          description: User Prize詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrizeDetail'
        default:
          $ref: '#/components/responses/Problem'
  /me/prizes/exchange:
    post:
      operationId: exchangeUserPrizes
      summary: User自身の景品を一括でfree Pointへ交換する
      x-idempotency: required
      x-rate-limit: user-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrizeExchangeRequest'
      responses:
        '200':
          description: 景品交換結果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrizeExchangeResponse'
        default:
          $ref: '#/components/responses/Problem'
  /me/shipping-addresses:
    get:
      operationId: listShippingAddresses
      summary: Mask済み配送先一覧を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      responses:
        '200':
          description: 配送先一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingAddressCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createShippingAddress
      summary: 配送先を作成する
      x-idempotency: not-supported
      x-rate-limit: user-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingAddressInput'
      responses:
        '201':
          description: 作成した配送先。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingAddress'
        default:
          $ref: '#/components/responses/Problem'
  /me/shipping-addresses/{address_id}:
    get:
      operationId: getShippingAddress
      summary: User本人の配送先詳細を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/ShippingAddressId'
      responses:
        '200':
          description: 配送先詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingAddress'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateShippingAddress
      summary: User本人の配送先を更新する
      x-idempotency: not-supported
      x-rate-limit: user-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/ShippingAddressId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingAddressInput'
      responses:
        '200':
          description: 更新した配送先。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingAddress'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteShippingAddress
      summary: User本人の配送先を削除する
      x-idempotency: naturally-idempotent
      x-rate-limit: user-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/ShippingAddressId'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: 削除結果。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    const: true
        default:
          $ref: '#/components/responses/Problem'
  /me/shipping-requests:
    get:
      operationId: listShippingRequests
      summary: User自身のShipping Request一覧を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/CatalogCursor'
      responses:
        '200':
          description: Shipping Request一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRequestCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createShippingRequest
      summary: 複数景品を1件のShipping Requestへまとめる
      x-idempotency: required
      x-rate-limit: user-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShippingRequest'
      responses:
        '201':
          description: Shipping Request作成結果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRequestSummary'
        default:
          $ref: '#/components/responses/Problem'
  /me/shipping-requests/{shipping_request_id}:
    get:
      operationId: getShippingRequest
      summary: User自身のShipping Request詳細を取得する
      x-idempotency: safe
      x-rate-limit: user-read
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/ShippingRequestId'
      responses:
        '200':
          description: Shipping Request詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRequestDetail'
        default:
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      operationId: registerUser
      summary: Userを仮登録する
      x-idempotency: not-supported
      x-rate-limit: ip-5-per-hour-and-email-3-per-hour
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '202':
          description: Email Verification待ち。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRegistration'
        default:
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      operationId: loginUser
      summary: User Password Loginを行う
      x-idempotency: not-supported
      x-rate-limit: account-ip-5-per-15-minutes-and-ip-30-per-hour
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: User Sessionを発行した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logoutUser
      summary: User Sessionを失効する
      x-idempotency: naturally-idempotent
      x-rate-limit: session
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Sessionを失効した。
        default:
          $ref: '#/components/responses/Problem'
  /auth/email/verification-notification:
    post:
      operationId: resendUserEmailVerification
      summary: Email Verificationを再送する
      x-idempotency: not-supported
      x-rate-limit: account-3-per-hour-and-10-per-day
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationResendRequest'
      responses:
        '202':
          description: 存在有無を開示せず受理した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          $ref: '#/components/responses/Problem'
  /auth/email/verify/{user_id}/{hash}:
    get:
      operationId: verifyUserEmail
      summary: 1回限りのTokenでEmailを検証する
      x-idempotency: one-time-token
      x-rate-limit: verification-token
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Emailを検証しUser Sessionを発行した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getUserSession
      summary: 現在のUser Sessionを取得する
      x-idempotency: safe
      x-rate-limit: session
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - {}
        - userSession: []
      responses:
        '200':
          description: Session状態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-oripa_user_session
  schemas:
    ContentAsset:
      type: object
      additionalProperties: false
      required: [id, path, checksum_sha256, alt_text]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        path:
          type: string
          pattern: '^/'
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        alt_text:
          type: [string, 'null']
          maxLength: 191
    ContentBanner:
      type: object
      additionalProperties: false
      required: [id, title, link_url, asset, publish_start_at, publish_end_at]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          maxLength: 191
        link_url:
          type: [string, 'null']
          maxLength: 2048
        asset:
          $ref: '#/components/schemas/ContentAsset'
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          type: [string, 'null']
          format: date-time
    ContentBannerCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentBanner'
    ContentNoticeSummary:
      type: object
      additionalProperties: false
      required:
        [id, slug, title, summary, is_important, asset, publish_start_at, publish_end_at]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 191
        summary:
          type: [string, 'null']
          maxLength: 500
        is_important:
          type: boolean
        asset:
          oneOf:
            - $ref: '#/components/schemas/ContentAsset'
            - type: 'null'
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          type: [string, 'null']
          format: date-time
    ContentNoticeCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentNoticeSummary'
        next_cursor:
          type: [string, 'null']
    ContentNotice:
      type: object
      additionalProperties: false
      required:
        [id, slug, title, summary, is_important, asset, publish_start_at,
         publish_end_at, body_html, checksum_sha256]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 191
        summary:
          type: [string, 'null']
          maxLength: 500
        is_important:
          type: boolean
        asset:
          oneOf:
            - $ref: '#/components/schemas/ContentAsset'
            - type: 'null'
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          type: [string, 'null']
          format: date-time
        body_html:
          type: string
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ContentStaticPage:
      type: object
      additionalProperties: false
      required:
        [id, slug, title, body_html, checksum_sha256, is_legal, publish_start_at, publish_end_at]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 191
        body_html:
          type: string
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        is_legal:
          type: boolean
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          type: [string, 'null']
          format: date-time
