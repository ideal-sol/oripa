openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Public API
  version: 2.0.0-alpha.1
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: Storefront向けPublic API v2の認証Contract Alpha。
  x-status: alpha
x-oripa-surface: public
servers:
  - url: /api/v2
paths:
  /gacha-categories:
    get:
      operationId: listGachaCategories
      summary: 公開中GachaのCategoryを取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-300-seconds
      x-stability: alpha
      security: []
      responses:
        '200':
          description: 公開Category一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaCategoryCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gacha-tags:
    get:
      operationId: listGachaTags
      summary: 公開中GachaのTagを取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-300-seconds
      x-stability: alpha
      security: []
      responses:
        '200':
          description: 公開Tag一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaTagCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gachas:
    get:
      operationId: listGachas
      summary: 公開期間内のGachaをCursor順で取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/CatalogCursor'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/TagSlug'
      responses:
        '200':
          description: 公開Gacha一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaSummaryCollection'
        default:
          $ref: '#/components/responses/Problem'
  /gachas/by-slug/{slug}:
    get:
      operationId: getGachaBySlug
      summary: Slugで公開中Gacha詳細を取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            maxLength: 128
      responses:
        '200':
          description: 公開Gacha詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDetailResponse'
        default:
          $ref: '#/components/responses/Problem'
  /gachas/{gacha_id}:
    get:
      operationId: getGacha
      summary: Opaque Public IDで公開中Gacha詳細を取得する
      x-idempotency: safe
      x-rate-limit: public-read
      x-cache-policy: public-60-seconds
      x-stability: alpha
      security: []
      parameters:
        - name: gacha_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: 公開Gacha詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDetailResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      operationId: registerUser
      summary: Userを仮登録する
      x-idempotency: not-supported
      x-rate-limit: ip-5-per-hour-and-email-3-per-hour
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '202':
          description: Email Verification待ち。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRegistration'
        default:
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      operationId: loginUser
      summary: User Password Loginを行う
      x-idempotency: not-supported
      x-rate-limit: account-ip-5-per-15-minutes-and-ip-30-per-hour
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: User Sessionを発行した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logoutUser
      summary: User Sessionを失効する
      x-idempotency: naturally-idempotent
      x-rate-limit: session
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Sessionを失効した。
        default:
          $ref: '#/components/responses/Problem'
  /auth/email/verification-notification:
    post:
      operationId: resendUserEmailVerification
      summary: Email Verificationを再送する
      x-idempotency: not-supported
      x-rate-limit: account-3-per-hour-and-10-per-day
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationResendRequest'
      responses:
        '202':
          description: 存在有無を開示せず受理した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          $ref: '#/components/responses/Problem'
  /auth/email/verify/{user_id}/{hash}:
    get:
      operationId: verifyUserEmail
      summary: 1回限りのTokenでEmailを検証する
      x-idempotency: one-time-token
      x-rate-limit: verification-token
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Emailを検証しUser Sessionを発行した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getUserSession
      summary: 現在のUser Sessionを取得する
      x-idempotency: safe
      x-rate-limit: session
      x-cache-policy: no-store
      x-stability: alpha
      security:
        - {}
        - userSession: []
      responses:
        '200':
          description: Session状態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-oripa_user_session
  schemas:
    OpaqueId:
      $ref: ../components/common.yaml#/schemas/OpaqueId
    SemanticVersion:
      $ref: ../components/common.yaml#/schemas/SemanticVersion
    UtcDateTime:
      $ref: ../components/common.yaml#/schemas/UtcDateTime
    BusinessDate:
      $ref: ../components/common.yaml#/schemas/BusinessDate
    ProblemDetails:
      $ref: ../components/common.yaml#/schemas/ProblemDetails
    CursorPageMeta:
      $ref: ../components/common.yaml#/schemas/CursorPageMeta
    PresentationAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - path
        - checksum_sha256
        - media_type
        - mime_type
        - alt_text
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        path:
          type: string
          pattern: '^/(?!/)'
          maxLength: 512
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        media_type:
          type: string
          enum: [image, video]
        mime_type:
          type: string
          maxLength: 128
        alt_text:
          type: [string, 'null']
          maxLength: 191
    NullablePresentationAsset:
      oneOf:
        - $ref: '#/components/schemas/PresentationAsset'
        - type: 'null'
    GachaCategory:
      type: object
      additionalProperties: false
      required: [id, slug, name, description]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          maxLength: 191
        description:
          type: [string, 'null']
    GachaTag:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          maxLength: 191
    GachaCategoryCollection:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GachaCategory'
    GachaTagCollection:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GachaTag'
    GachaSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - price_points
        - total_count
        - remaining_count
        - publish_start_at
        - publish_end_at
        - category
        - tags
        - presentation_asset
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 191
        price_points:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 1
        remaining_count:
          type: integer
          minimum: 0
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        category:
          $ref: '#/components/schemas/GachaCategory'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/GachaTag'
        presentation_asset:
          $ref: '#/components/schemas/NullablePresentationAsset'
    GachaSummaryCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GachaSummary'
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
    RankReference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        code:
          type: string
          pattern: '^[A-Z0-9_-]{1,32}$'
        name:
          type: string
          maxLength: 128
    RankPresentationAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - path
        - checksum_sha256
        - media_type
        - mime_type
        - alt_text
        - usage_type
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        path:
          type: string
          pattern: '^/(?!/)'
          maxLength: 512
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        media_type:
          type: string
          enum: [image, video]
        mime_type:
          type: string
          maxLength: 128
        alt_text:
          type: [string, 'null']
          maxLength: 191
        usage_type:
          type: string
          enum: [image, video, result_image]
    PrizeDisplay:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - display_price
        - exchange_points
        - presentation_asset
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          maxLength: 191
        description:
          type: [string, 'null']
        display_price:
          type: integer
          minimum: 0
        exchange_points:
          type: integer
          minimum: 0
        presentation_asset:
          $ref: '#/components/schemas/NullablePresentationAsset'
    RankDisplay:
      type: object
      additionalProperties: false
      required: [id, code, name, presentation_assets, prizes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        code:
          type: string
          pattern: '^[A-Z0-9_-]{1,32}$'
        name:
          type: string
          maxLength: 128
        presentation_assets:
          type: array
          items:
            $ref: '#/components/schemas/RankPresentationAsset'
        prizes:
          type: array
          items:
            $ref: '#/components/schemas/PrizeDisplay'
    StageCondition:
      type: object
      additionalProperties: false
      required: [type, min_draw_number, max_draw_number]
      properties:
        type:
          type: string
          const: sold_count
        min_draw_number:
          type: integer
          minimum: 1
        max_draw_number:
          type: [integer, 'null']
          minimum: 1
    RankProbability:
      type: object
      additionalProperties: false
      required: [rank, total_ppm]
      properties:
        rank:
          $ref: '#/components/schemas/RankReference'
        total_ppm:
          type: integer
          minimum: 0
          maximum: 1000000
    MinimumGuarantee:
      type: object
      additionalProperties: false
      required: [result_type, total_ppm]
      properties:
        result_type:
          type: string
          enum: [prize, point_back]
        total_ppm:
          type: integer
          minimum: 0
          maximum: 1000000
        rank:
          $ref: '#/components/schemas/RankReference'
        point_amount:
          type: integer
          minimum: 0
      oneOf:
        - required: [rank]
        - required: [point_amount]
    ProbabilityStage:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - condition
        - is_current
        - rank_probabilities
        - point_back_total_ppm
        - minimum_guarantee
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        condition:
          $ref: '#/components/schemas/StageCondition'
        is_current:
          type: boolean
        rank_probabilities:
          type: array
          items:
            $ref: '#/components/schemas/RankProbability'
        point_back_total_ppm:
          type: integer
          minimum: 0
          maximum: 1000000
        minimum_guarantee:
          $ref: '#/components/schemas/MinimumGuarantee'
    GachaDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - price_points
        - total_count
        - remaining_count
        - publish_start_at
        - publish_end_at
        - category
        - tags
        - presentation_asset
        - description
        - notices
        - ranks
        - probability_stages
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 191
        price_points:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 1
        remaining_count:
          type: integer
          minimum: 0
        publish_start_at:
          $ref: '#/components/schemas/UtcDateTime'
        publish_end_at:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        category:
          $ref: '#/components/schemas/GachaCategory'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/GachaTag'
        presentation_asset:
          $ref: '#/components/schemas/NullablePresentationAsset'
        description:
          type: [string, 'null']
        notices:
          type: [string, 'null']
        ranks:
          type: array
          items:
            $ref: '#/components/schemas/RankDisplay'
        probability_stages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProbabilityStage'
    GachaDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GachaDetail'
    UserRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        redirect_path:
          type: string
          default: /
          pattern: '^/(?!/)'
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    VerificationResendRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        redirect_path:
          type: string
          default: /
          pattern: '^/(?!/)'
    PendingRegistration:
      type: object
      additionalProperties: false
      required: [status, user_id]
      properties:
        status:
          type: string
          const: pending_verification
        user_id:
          type: string
          format: uuid
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, state, email_verified]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [active, restricted]
        email_verified:
          type: boolean
          const: true
    UserSession:
      type: object
      additionalProperties: false
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
        redirect_path:
          type: string
          pattern: '^/(?!/)'
    Accepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
  parameters:
    XOripaClientVersion:
      $ref: ../components/common.yaml#/parameters/XOripaClientVersion
    XOripaSiteVersion:
      $ref: ../components/common.yaml#/parameters/XOripaSiteVersion
    IdempotencyKey:
      $ref: ../components/common.yaml#/parameters/IdempotencyKey
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    CatalogLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CatalogCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CategorySlug:
      name: category
      in: query
      required: false
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 128
    TagSlug:
      name: tag
      in: query
      required: false
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 128
  headers:
    XRequestId:
      $ref: ../components/common.yaml#/headers/XRequestId
    XOripaApiVersion:
      $ref: ../components/common.yaml#/headers/XOripaApiVersion
    IdempotencyReplayed:
      $ref: ../components/common.yaml#/headers/IdempotencyReplayed
    RetryAfter:
      $ref: ../components/common.yaml#/headers/RetryAfter
  responses:
    Problem:
      $ref: ../components/common.yaml#/responses/Problem
