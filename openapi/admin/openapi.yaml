      type: object
      additionalProperties: false
      required: [report_type, period_type]
      properties:
        report_type:
          type: string
          enum: [sales, adjustments, point_ledger, draw_results, point_snapshots]
        period_type:
          type: string
          enum: [month, date]
        month:
          type: [string, 'null']
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        date:
          type: [string, 'null']
          format: date
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
    ExportJob:
      type: object
      additionalProperties: false
      required:
        - export_job_id
        - report_type
        - status
        - period_type
        - month
        - date
        - qa_filter
        - data_cutoff_at
        - query_version
        - row_count
        - byte_size
        - sha256
        - failure_code
        - completed_at
        - expires_at
        - created_at
      properties:
        export_job_id:
          $ref: '#/components/schemas/OpaqueId'
        report_type:
          type: string
          enum: [sales, adjustments, point_ledger, draw_results, point_snapshots]
        status:
          type: string
          enum: [queued, processing, completed, failed, expired]
        period_type:
          type: string
          enum: [month, date]
        month:
          type: [string, 'null']
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        date:
          type: [string, 'null']
          format: date
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
        data_cutoff_at:
          type: string
          format: date-time
        query_version:
          type: string
        row_count:
          type: [integer, 'null']
          minimum: 0
        byte_size:
          type: [integer, 'null']
          minimum: 0
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        failure_code:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        idempotent_replay:
          type: boolean
    ExportDownload:
      type: object
      additionalProperties: false
      required: [export_job_id, download_url, expires_at, sha256, byte_size]
      properties:
        export_job_id:
          $ref: '#/components/schemas/OpaqueId'
        download_url:
          type: string
          format: uri-reference
        expires_at:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        byte_size:
          type: integer
          minimum: 0
