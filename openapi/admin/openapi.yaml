          type: string
          enum: [month, date]
        month:
          type: [string, 'null']
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        date:
          type: [string, 'null']
          format: date
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
    ExportJob:
      type: object
      additionalProperties: false
      required:
        - export_job_id
