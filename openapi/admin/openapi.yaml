        gacha_title:
          type: [string, 'null']
          maxLength: 191
        draw_count:
          type: [integer, 'null']
          minimum: 1
        paid_consumed:
          type: integer
          minimum: 0
        free_consumed:
          type: integer
          minimum: 0
