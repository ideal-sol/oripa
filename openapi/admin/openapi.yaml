        - title
        - request_count
        - draw_count
        - consumed_paid_points
        - consumed_free_points
      properties:
        gacha_id:
          $ref: '#/components/schemas/OpaqueId'
        gacha_version_id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          maxLength: 191
        request_count:
          type: integer
          minimum: 0
        draw_count:
          type: integer
          minimum: 0
        consumed_paid_points:
          type: integer
          minimum: 0
        consumed_free_points:
          type: integer
          minimum: 0
    GachaReport:
      type: object
      additionalProperties: false
      required: [month, qa_filter, items, rank_results, prize_results]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GachaReportEntry'
        rank_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [gacha_id, rank_id, rank_code, rank_name, result_count]
            properties:
              gacha_id:
                $ref: '#/components/schemas/OpaqueId'
              rank_id:
                $ref: '#/components/schemas/OpaqueId'
              rank_code:
                type: string
                maxLength: 32
              rank_name:
                type: string
                maxLength: 128
              result_count:
                type: integer
                minimum: 0
        prize_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [gacha_id, prize_id, prize_name, result_count]
            properties:
              gacha_id:
                $ref: '#/components/schemas/OpaqueId'
              prize_id:
                $ref: '#/components/schemas/OpaqueId'
              prize_name:
                type: string
                maxLength: 191
              result_count:
                type: integer
                minimum: 0
