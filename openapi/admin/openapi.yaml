      allOf:
        - {$ref: '#/components/schemas/AdminGachaComposition'}
        - type: object
          properties:
            publish_start_at: {type: string, format: date-time}
            ranks: {minItems: 1}
            prizes: {minItems: 1}
        - if: {properties: {gacha_type: {const: standard}}}
