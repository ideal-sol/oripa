    AdminGachaPurchaseConditions:
      type: object
      allOf:
        - if: {properties: {purchase_count_mode: {const: none}}}
          then: {properties: {purchase_count_value: {type: 'null'}}}
          else:
            required: [purchase_count_value]
            properties: {purchase_count_value: {type: integer}}
        - if: {required: [purchase_count_mode], properties: {purchase_count_mode: {enum: [gte, lt]}}}
          then: {properties: {purchase_count_value: {minimum: 1}}}
        - if: {properties: {purchase_amount_mode: {const: none}}}
          then: {properties: {purchase_amount_value: {type: 'null'}}}
          else:
            required: [purchase_amount_value]
            properties: {purchase_amount_value: {type: integer}}
        - if: {required: [purchase_amount_mode], properties: {purchase_amount_mode: {enum: [gte, lt]}}}
          then: {properties: {purchase_amount_value: {minimum: 1}}}
        - not:
            allOf:
              - required: [purchase_count_mode, purchase_count_value]
                anyOf:
                  - properties: {purchase_count_mode: {const: eq}, purchase_count_value: {const: 0}}
                  - properties: {purchase_count_mode: {const: lt}, purchase_count_value: {const: 1}}
              - required: [purchase_amount_mode, purchase_amount_value]
                properties: {purchase_amount_mode: {enum: [eq, gte]}, purchase_amount_value: {type: integer, minimum: 1}}
        - not:
            allOf:
              - required: [purchase_amount_mode, purchase_amount_value]
                anyOf:
                  - properties: {purchase_amount_mode: {const: eq}, purchase_amount_value: {const: 0}}
                  - properties: {purchase_amount_mode: {const: lt}, purchase_amount_value: {const: 1}}
              - required: [purchase_count_mode, purchase_count_value]
                properties: {purchase_count_mode: {enum: [eq, gte]}, purchase_count_value: {type: integer, minimum: 1}}
