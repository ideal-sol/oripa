        id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          $ref: '#/components/schemas/ShippingStatus'
        prize_count:
          type: integer
          minimum: 1
        requested_at:
          $ref: '#/components/schemas/UtcDateTime'
        shipped_at:
          type: [string, 'null']
          format: date-time
        carrier_code:
          type: [string, 'null']
    AdminShippingRequestDetail:
      allOf:
        - $ref: '#/components/schemas/AdminShippingRequestSummary'
        - type: object
          required: [prize_ids, tracking_number, shipping_address, status_history]
          properties:
            prize_ids:
              type: array
              items:
                $ref: '#/components/schemas/OpaqueId'
            tracking_number:
              type: [string, 'null']
            shipping_address:
              type: object
              additionalProperties: false
              required: [recipient_name, postal_code, prefecture, city, street, building, phone_number]
              properties:
                recipient_name:
                  type: string
                postal_code:
                  type: string
                prefecture:
                  type: string
                city:
                  type: string
                street:
                  type: string
                building:
                  type: [string, 'null']
                phone_number:
                  type: string
            status_history:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [from_status, to_status, reason_code, occurred_at]
                properties:
                  from_status:
                    type: [string, 'null']
                  to_status:
                    type: string
                  reason_code:
                    type: string
                  occurred_at:
                    $ref: '#/components/schemas/UtcDateTime'
    AdminShippingRequestCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminShippingRequestSummary'
        next_cursor:
          type: [string, 'null']
    SemanticVersion:
      $ref: ../components/common.yaml#/schemas/SemanticVersion
    UtcDateTime:
      $ref: ../components/common.yaml#/schemas/UtcDateTime
    BusinessDate:
      $ref: ../components/common.yaml#/schemas/BusinessDate
    ProblemDetails:
      $ref: ../components/common.yaml#/schemas/ProblemDetails
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        invitation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
    AdminPreauth:
      type: object
      additionalProperties: false
      required: [status, transaction_token, expires_in, methods, webauthn]
      properties:
        status:
          type: string
          const: mfa_required
        transaction_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [totp, webauthn, recovery_code]
        webauthn:
          oneOf:
            - $ref: '#/components/schemas/WebauthnOptions'
            - type: 'null'
    AdminMfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [totp, webauthn, recovery_code]
        code:
          type: string
          maxLength: 128
          writeOnly: true
        challenge_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        credential:
          type: object
          additionalProperties: true
    AdminReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [totp, webauthn]
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        challenge_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        credential:
          type: object
          additionalProperties: true
    AdminReauthenticationResponse:
      type: object
      additionalProperties: false
      required: [authenticated, fresh_mfa_expires_in, admin]
      properties:
        authenticated:
          type: boolean
          const: true
        fresh_mfa_expires_in:
          type: integer
          const: 300
        admin:
          $ref: '#/components/schemas/AdminIdentity'
    AdminIdentity:
      type: object
      additionalProperties: false
      required: [id, role, state]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, operator]
        state:
          type: string
          enum: [active]
        mfa_verified:
          type: boolean
    AdminSession:
      type: object
      additionalProperties: false
      required: [authenticated, admin]
      properties:
        authenticated:
          type: boolean
        requires_mfa_enrollment:
          type: boolean
        enrollment_transaction_token:
          oneOf:
            - type: string
              pattern: '^[0-9a-f]{64}$'
              writeOnly: true
            - type: 'null'
        enrollment_transaction_expires_in:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 300
            - type: 'null'
        admin:
          oneOf:
            - $ref: '#/components/schemas/AdminIdentity'
            - type: 'null'
    AdminPermissionCode:
      type: string
      enum:
        - identity.admin.read
        - identity.admin.manage
        - identity.admin.session.revoke
        - identity.line.manage
        - point.ledger.read
        - point.adjustment.request
        - point.adjustment.free.approve
        - point.adjustment.paid.approve
        - catalog.read
        - catalog.manage
        - shipping.request.manage
        - qa.draw.manage
        - reporting.financial.read
        - reporting.financial.export
        - content.read
        - content.manage
        - content.publish
        - contact.read
        - contact.manage
    AdminEffectivePermissions:
      type: object
      additionalProperties: false
      required: [role, permissions, request_id]
      properties:
        role:
          type: string
          enum: [owner, admin, operator]
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
        request_id:
          type: string
          format: uuid
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [enrollment_token, secret, otpauth_uri, expires_in]
      properties:
        enrollment_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        secret:
          type: string
          minLength: 16
          writeOnly: true
        otpauth_uri:
          type: string
          pattern: '^otpauth://totp/'
          writeOnly: true
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
    TotpConfirmation:
      type: object
      additionalProperties: false
      required: [enrollment_token, code]
      properties:
        enrollment_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
    WebauthnOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
    WebauthnOptions:
      type: object
      additionalProperties: false
      required: [challenge_token, options, expires_in]
      properties:
        challenge_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        options:
          type: object
          additionalProperties: true
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
    WebauthnRegistration:
      type: object
      additionalProperties: false
      required: [challenge_token, credential]
      properties:
        challenge_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          writeOnly: true
        credential:
          type: object
          additionalProperties: true
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[0-9a-f]{32}$'
            writeOnly: true
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, registered]
    AmountCount:
      type: object
      additionalProperties: false
      required: [count, amount]
      properties:
        count:
          type: integer
          minimum: 0
        amount:
          type: integer
          minimum: 0
    MonthlySalesDay:
      type: object
      additionalProperties: false
      required: [business_date, payment_count, gross_amount]
      properties:
        business_date:
          type: string
          format: date
        payment_count:
          type: integer
          minimum: 0
        gross_amount:
          type: integer
          minimum: 0
    MonthlySalesReport:
      type: object
