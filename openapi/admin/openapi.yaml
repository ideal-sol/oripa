          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        date:
          type: string
          format: date
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, 'null']
    PointReportEntry:
      type: object
      additionalProperties: false
      required: [point_type, entry_type, source_type, entry_count, amount]
