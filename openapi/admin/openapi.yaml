openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Admin API
  version: 2.0.0-alpha.1
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: 共通管理画面向けAdmin API v2の認証Contract Alpha。
  x-status: alpha
x-oripa-surface: admin
x-oripa-error-codes:
  FRESH_AUTHENTICATION_REQUIRED:
    status: 403
    retryable: false
    description: Admin MFA確認から5分以上経過したCritical管理操作は再認証を要求する。
  REPORTING_PERIOD_INVALID:
    status: 422
    retryable: false
    description: Reporting期間が不正。
  EXPORT_ASYNC_REQUIRED:
    status: 422
    retryable: false
    description: 大量Exportは非同期Job作成が必要。
  CONTENT_NOT_FOUND:
    status: 404
    retryable: false
    description: Content Resourceが存在しない、または参照できない。
  CONTENT_REQUEST_INVALID:
    status: 422
    retryable: false
    description: Content入力が不正。
  CONTACT_NOT_FOUND:
    status: 404
    retryable: false
    description: Contact Inquiryが存在しない、または参照できない。
  INVALID_CATALOG_QUERY:
    status: 422
    retryable: false
    description: Catalog検索条件が不正。
  INVALID_CURSOR:
    status: 422
    retryable: false
    description: Catalog Cursorが不正、改ざん済み、または検索条件と不一致。
  CATALOG_RESOURCE_NOT_FOUND:
    status: 404
    retryable: false
    description: Catalog Resourceが存在しない。
  CATALOG_MUTATION_INVALID:
    status: 422
    retryable: false
    description: Catalog Mutation入力が不正。
  CATALOG_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: Catalog Masterが別の操作で更新済み。
  CATALOG_PUBLISHED_REFERENCE_CONFLICT:
    status: 409
    retryable: false
    description: 公開中または公開予定のGachaがCatalog Masterを参照中。
  CATALOG_ASSET_IDENTITY_IMMUTABLE:
    status: 409
    retryable: false
    description: Presentation AssetのObject識別情報は作成後変更不可。
  IDEMPOTENCY_KEY_REUSED:
    status: 409
    retryable: false
    description: Idempotency-Keyが異なるRequestへ再利用された。
  LINE_MESSAGING_SETTING_INVALID:
    status: 422
    retryable: false
    description: LINE Message設定が空、不正なHTMLを含む、または未知の置換変数を含む。
  LINE_MESSAGING_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: LINE Message設定が別の操作で更新済み。
servers:
  - url: /admin/api/v2
paths:
  /identity/line-messaging:
    get:
      operationId: getAdminLineMessagingSetting
      summary: LINE Follow自動応答Message設定を取得する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      responses:
        '200':
          description: Ownerだけが参照できるMessage設定。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLineMessagingSettingResponse'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateAdminLineMessagingSetting
      summary: LINE Follow自動応答Message設定を更新する
      description: Ownerかつ5分以内のFresh MFA、Revision OCC、Idempotency-Keyを必須とする。
      x-idempotency: required
      x-rate-limit: critical-admin-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLineMessagingSettingUpdate'}
      responses:
        '200':
          description: 更新済みMessage設定。
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLineMessagingMutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /identity/line-messaging/preview:
    post:
      operationId: previewAdminLineMessagingSetting
      summary: LINE Follow自動応答Messageを送信せずPreviewする
      x-idempotency: not-supported
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLineMessagingPreviewRequest'}
      responses:
        '200':
          description: Server側Allowlistで置換済みのPreview。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLineMessagingPreview'}
        default: {$ref: '#/components/responses/Problem'}
  /catalog/categories:
    get:
      operationId: listAdminCatalogCategories
      summary: Category一覧を参照する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
