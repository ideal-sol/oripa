      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCatalogCategoryCreate'}
      responses:
        '201': {description: Category作成結果。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCatalogCategoryMutationResult'}}}}
        default: {$ref: '#/components/responses/Problem'}
