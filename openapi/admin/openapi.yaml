  /settings/member-ranks/prelaunch-activation:
    post:
      operationId: activateAdminMemberRankPrelaunch
      summary: 承認済み公開前サイトの会員ランクを一度だけ有効化する
      description: >-
        Owner、実際の5分以内のFresh MFA、Admin Session/CSRF、Idempotency-Keyを必須とする。
        別途特権管理された不変のサイト限定承認とOrigin manifest、expected_revisionを排他下で照合する。
        通常Adminは承認を作成・変更できない。既存テスト決済のみ不変集合で除外し、ユーザーや金融履歴は変更しない。
        未完了処理・正規事前登録者の有償取引・既存ランク業務データ・承認不一致はMEMBER_RANK_PRELAUNCH_HOLD(409)。
        競合時はMEMBER_RANK_ACTIVATION_BUSY(409)、二重ONはMEMBER_RANK_ALREADY_ACTIVATED(409)。
        通常設定PUTの初回409および不可逆ONは維持する。Runtime/Activationには独立Human GOが必要。
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminMemberRankPrelaunchActivationRequest'}
      responses:
        '200':
          description: 不可逆有効化と除外Origin集合を同一commitで公開済み。
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMemberRankPrelaunchActivationResponse'}
        default: {$ref: '#/components/responses/Problem'}
