        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/CatalogSearch'}
        - {$ref: '#/components/parameters/CatalogVisibility'}
        - {$ref: '#/components/parameters/CatalogDirection'}
        - {name: sort, in: query, schema: {type: string, enum: [sort_order, name, code], default: sort_order}}
      responses:
        '200': {description: Category一覧。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCatalogCategoryCollection'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAdminCatalogCategory
