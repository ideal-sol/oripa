components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-oripa_admin_session
  schemas:
    AdminLineMessagingSetting:
      type: object
      additionalProperties: false
      required:
        - id
        - linked_follow_message
        - pending_follow_message
        - login_relative_path
        - revision
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        linked_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        pending_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        login_relative_path:
          type: string
          pattern: '^/[A-Za-z0-9/_?&=.-]*$'
          readOnly: true
        revision:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    AdminLineMessagingSettingResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/AdminLineMessagingSetting'
        request_id:
          $ref: '#/components/schemas/OpaqueId'
    AdminLineMessagingSettingUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, linked_follow_message, pending_follow_message]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        linked_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        pending_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
    AdminLineMessagingPreviewRequest:
      type: object
      additionalProperties: false
      required: [linked_follow_message, pending_follow_message]
      properties:
        linked_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        pending_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
    AdminLineMessagingPreview:
      type: object
      additionalProperties: false
      required: [linked_follow_message, pending_follow_message, request_id]
      properties:
        linked_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        pending_follow_message:
          type: string
          minLength: 1
          maxLength: 1000
        request_id:
          $ref: '#/components/schemas/OpaqueId'
    AdminLineMessagingMutationResult:
      type: object
      additionalProperties: false
      required: [data, idempotent_replay, request_id]
      properties:
        data:
          $ref: '#/components/schemas/AdminLineMessagingSetting'
        idempotent_replay:
