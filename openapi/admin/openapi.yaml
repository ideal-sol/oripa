        point_type:
          type: string
          enum: [paid, free]
        entry_type:
          type: string
          enum: [grant, spend, expire, reverse, restore]
        source_type:
          type: string
          maxLength: 32
        entry_count:
          type: integer
          minimum: 0
        amount:
          type: integer
          minimum: 0
    PointReport:
      type: object
      additionalProperties: false
      required: [month, entries]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PointReportEntry'
    GachaReportEntry:
      type: object
      additionalProperties: false
      required:
        - gacha_id
        - gacha_version_id
        - title
        - request_count
        - draw_count
        - consumed_paid_points
        - consumed_free_points
      properties:
        gacha_id:
          $ref: '#/components/schemas/OpaqueId'
        gacha_version_id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          maxLength: 191
        request_count:
          type: integer
          minimum: 0
        draw_count:
          type: integer
          minimum: 0
        consumed_paid_points:
          type: integer
          minimum: 0
        consumed_free_points:
          type: integer
          minimum: 0
    GachaReport:
      type: object
      additionalProperties: false
      required: [month, qa_filter, items, rank_results, prize_results]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
