          type: string
          format: date-time
    DashboardDailyPointReport:
      type: object
      additionalProperties: false
      required: [date, timezone, qa_excluded, summary, items, next_cursor]
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
          const: Asia/Tokyo
        qa_excluded:
          type: boolean
          const: true
        summary:
          $ref: '#/components/schemas/DashboardPointSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPointConsumption'
        next_cursor:
          type: [string, 'null']
    DashboardPaymentReversal:
      type: object
      additionalProperties: false
      required:
        - adjustment_id
        - payment_id
        - type
        - status
        - amount
        - currency
        - occurred_at
      properties:
        adjustment_id:
          $ref: '#/components/schemas/OpaqueId'
        payment_id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          enum: [refund, chargeback, chargeback_reversal]
