                $ref: '#/components/schemas/OpaqueId'
              rank_id:
                $ref: '#/components/schemas/OpaqueId'
              rank_code:
                type: string
                maxLength: 32
              rank_name:
                type: string
                maxLength: 128
              result_count:
                type: integer
                minimum: 0
        prize_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [gacha_id, prize_id, prize_name, result_count]
            properties:
              gacha_id:
                $ref: '#/components/schemas/OpaqueId'
              prize_id:
                $ref: '#/components/schemas/OpaqueId'
              prize_name:
                type: string
                maxLength: 191
              result_count:
                type: integer
                minimum: 0
