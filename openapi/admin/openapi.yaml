openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Admin API
  version: 2.0.0-alpha.43
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: 共通管理画面向けAdmin API v2の認証Contract Alpha。
  x-status: alpha
x-oripa-surface: admin
x-oripa-breaking-change:
  authority: human_MEMBERRANK-M9-20261020
  change_id: MEMBERRANK-M9-20261020
  scope: admin-payment-provider-fincode-literal-to-actual-provider
x-oripa-error-codes:
  MEMBER_RANK_PRELAUNCH_HOLD: {status: 409, retryable: false, description: サイト限定承認または公開前データの照合を完了できません。}
  MEMBER_RANK_ACTIVATION_BUSY: {status: 409, retryable: false, description: 関連処理の終了後に同じリクエストを再試行してください。}
  MEMBER_RANK_ALREADY_ACTIVATED: {status: 409, retryable: false, description: 初回有効化は完了済みです。}
  FRESH_MFA_REQUIRED: {status: 403, retryable: false, description: 実際の5分以内のMFA再認証が必要です。}
  PAYMENT_RANK_ADJUSTMENT_NOT_READY: {status: 409, retryable: false, description: 付与元・ランク計上・会員状態の不整合、機能停止または凍結により安全な取消を確定できません。}
  PAYMENT_ADJUSTMENT_CONFLICT: {status: 409, retryable: false, description: 競合する調整があります。最新の詳細を確認してください。}
  PAYMENT_ADJUSTMENT_INPUT_INVALID: {status: 422, retryable: false, description: 理由と確認事項を入力してください。}
  ADMIN_ADJUSTMENT_NOT_FOUND: {status: 404, retryable: false, description: 調整が見つかりません。}
  CHARGEBACK_REVERSAL_ALREADY_RECORDED: {status: 409, retryable: false, description: このチャージバックの取消は記録済みです。}
  MEMBER_RANK_QUERY_INVALID: {status: 422, retryable: false, description: 検索条件を確認してください。}
  MEMBER_RANK_INPUT_INVALID: {status: 422, retryable: false, description: 入力内容を確認してください。}
  MEMBER_RANK_REVISION_CONFLICT: {status: 409, retryable: false, description: 最新の差分を再確認してください。}
  MEMBER_RANK_TRANSFER_CONFIRMATION_REQUIRED: {status: 409, retryable: false, description: 前回の引き継ぎ内容を確認してください。}
  MEMBER_RANK_USER_UNAVAILABLE: {status: 409, retryable: false, description: 有効な会員のみ変更できます。}
  MEMBER_RANK_NOT_ENABLED: {status: 409, retryable: false, description: 会員ランク機能は運用開始前です。}
  MEMBER_RANK_POINTS_OUT_OF_RANGE: {status: 422, retryable: false, description: 調整後のランクポイントが範囲外です。}
  MEMBER_RANK_SETTINGS_INVALID:
    status: 422
    retryable: false
    description: 会員ランク設定の入力値を確認してください。
  MEMBER_RANK_SETTINGS_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: 設定が更新されました。最新の設定を取得してください。
  MEMBER_RANK_ACTIVATION_NOT_READY:
    status: 409
    retryable: false
    description: 会員ランク機能は準備中のため有効化できません。
  MEMBER_RANK_DEACTIVATION_FORBIDDEN:
    status: 409
    retryable: false
    description: 運用開始後は無効化できません。
  MEMBER_RANK_SCHEDULE_NOT_FOUND:
    status: 409
    retryable: false
    description: 取消可能な翌月設定がありません。
  MEMBER_RANK_SETTINGS_UNAVAILABLE:
    status: 503
    retryable: false
    description: 会員ランク設定を取得できません。
  NOTION_DISABLED:
    status: 409
    retryable: false
    description: Notion連携は無効です。
  NOTION_CONFIGURATION_INVALID:
    status: 503
    retryable: false
    description: Notion設定を安全な管理経路で確認してください。
  NOTION_RUN_NOT_FOUND:
    status: 404
    retryable: false
    description: 同期ジョブが存在しません。
  NOTION_SYNC_FAILED:
    status: 503
    retryable: false
    description: 同期要求の処理に失敗しました。状態確認後に再試行してください。
  AGENCY_INVALID:
    status: 422
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  AGENCY_NOT_FOUND:
    status: 404
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  AGENCY_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  AGENCY_IDENTITY_CONFLICT:
    status: 409
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  AGENCY_IDENTIFIER_EXHAUSTED:
    status: 409
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  AGENCY_SAVE_FAILED:
    status: 503
    retryable: false
    description: 代理店の入力・存在・更新競合または保存状態を確認してください。
  FRESH_AUTHENTICATION_REQUIRED:
    status: 403
    retryable: false
    description: 旧client互換のため維持する廃止済みerror code。Admin業務操作ではFresh期限による拒否を行わない。
  REPORTING_PERIOD_INVALID:
    status: 422
    retryable: false
    description: Reporting期間が不正。
  ADMIN_USER_NOT_FOUND:
    status: 404
    retryable: false
    description: 指定されたUserが存在しない、または参照できない。
  POINT_ADJUSTMENT_INVALID:
    status: 422
    retryable: false
    description: Point Adjustment入力が不正。
  POINT_ADJUSTMENT_INSUFFICIENT_BALANCE:
    status: 409
    retryable: false
    description: 指定Point種別の利用可能残高が不足している。
  EXPORT_ASYNC_REQUIRED:
    status: 422
    retryable: false
    description: 大量Exportは非同期Job作成が必要。
  CONTENT_NOT_FOUND:
    status: 404
    retryable: false
    description: Content Resourceが存在しない、または参照できない。
  CONTENT_REQUEST_INVALID:
    status: 422
    retryable: false
    description: Content入力が不正。
  CONTACT_NOT_FOUND:
    status: 404
    retryable: false
    description: Contact Inquiryが存在しない、または参照できない。
  INVALID_CATALOG_QUERY:
    status: 422
    retryable: false
    description: Catalog検索条件が不正。
  INVALID_CURSOR:
    status: 422
    retryable: false
    description: Catalog Cursorが不正、改ざん済み、または検索条件と不一致。
  CATALOG_RESOURCE_NOT_FOUND:
    status: 404
    retryable: false
    description: Catalog Resourceが存在しない。
  CATALOG_MUTATION_INVALID:
    status: 422
    retryable: false
    description: Catalog Mutation入力が不正。
  CATALOG_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: Catalog Masterが別の操作で更新済み。
  CATALOG_PUBLISHED_REFERENCE_CONFLICT:
    status: 409
    retryable: false
    description: 公開中または公開予定のGachaがCatalog Masterを参照中。
  CATALOG_ASSET_IDENTITY_IMMUTABLE:
    status: 409
    retryable: false
    description: Presentation AssetのObject識別情報は作成後変更不可。
  IDEMPOTENCY_KEY_REUSED:
    status: 409
    retryable: false
    description: Idempotency-Keyが異なるRequestへ再利用された。
  POINT_PURCHASE_PLAN_INVALID:
    status: 422
    retryable: false
    description: ポイント購入商品の入力またはCursorが不正。
  POINT_PURCHASE_PLAN_NOT_FOUND:
    status: 404
    retryable: false
    description: ポイント購入商品が存在しない。
  POINT_PURCHASE_PLAN_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: ポイント購入商品が別の操作で更新済み。
  LINE_MESSAGING_SETTING_INVALID:
    status: 422
    retryable: false
    description: LINE Message設定が空、不正なHTMLを含む、または未知の置換変数を含む。
  LINE_MESSAGING_REVISION_CONFLICT:
    status: 409
    retryable: false
    description: LINE Message設定が別の操作で更新済み。
servers:
  - url: /admin/api/v2
paths:
  /payments/{paymentId}: {"get":{"operationId":"getAdminPayment","summary":"決済詳細","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"reporting.financial.read","x-idempotency":"safe","x-rate-limit":"admin-read","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}}],"responses":{"200":{"description":"決済詳細","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentDetailResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}}}}
  /payments/{paymentId}/refunds: {"post":{"operationId":"prepareAdminPaymentRefund","summary":"返金の準備","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"required","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"200":{"description":"返金の準備","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentInput"}}}}}}
  /payments/{paymentId}/refunds/{adjustmentId}/complete: {"post":{"operationId":"completeAdminPaymentRefund","summary":"返金済みにする","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"required","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"name":"adjustmentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"200":{"description":"返金済みにする","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentRefundCompleteInput"}}}}}}
  /payments/{paymentId}/refunds/{adjustmentId}/cancel: {"post":{"operationId":"cancelAdminPaymentRefund","summary":"返金の準備を取りやめる","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"required","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"name":"adjustmentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"200":{"description":"返金の準備を取りやめる","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentInput"}}}}}}
  /payments/{paymentId}/chargebacks/preview: {"post":{"operationId":"previewAdminPaymentChargeback","summary":"チャージバックの取消予定額","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"safe","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}}],"responses":{"200":{"description":"チャージバックの取消予定額","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentChargebackPreviewResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentInput"}}}}}}
  /payments/{paymentId}/chargebacks: {"post":{"operationId":"recordAdminPaymentChargeback","summary":"チャージバックを記録","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"required","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"200":{"description":"チャージバックを記録","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentInput"}}}}}}
  /payments/{paymentId}/chargebacks/{adjustmentId}/reversals: {"post":{"operationId":"reverseAdminPaymentChargeback","summary":"チャージバック取消を記録","description":"Providerへの通信・自動通知は行わない。M8の会員ランク連動は未実装。条件競合は日本語の理由付き409。","x-required-permission":"payment.adjustment.manage","x-idempotency":"required","x-rate-limit":"admin-write","x-cache-policy":"private-no-store","x-stability":"alpha","security":[{"adminSession":[]}],"parameters":[{"name":"paymentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"name":"adjustmentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/OpaqueId"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"200":{"description":"チャージバック取消を記録","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentResponse"}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPaymentAdjustmentInput"}}}}}}
  /settings/pre-registration:
    get:
      operationId: getAdminPreRegistration
      summary: 事前登録特典設定と切替集計を取得する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      responses:
        '200':
          description: Owner/Admin/Operatorが閲覧可能。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPreRegistrationResponse'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateAdminPreRegistration
      summary: 事前登録特典設定を更新する
      description: Owner/Adminのみ。RevisionとIdempotency-Key必須。初回切替以降は締切固定、未完了対象が残る間は付与額変更不可。409 PRE_REGISTRATION_REVISION_CONFLICT / PRE_REGISTRATION_AMOUNT_LOCKED / PRE_REGISTRATION_CUTOFF_LOCKED / IDEMPOTENCY_KEY_REUSED。
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPreRegistrationUpdate'}
      responses:
        '200':
          description: 更新済み設定。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPreRegistrationResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /settings/pre-registration/preview:
    post:
      operationId: previewAdminPreRegistration
      summary: 設定変更前の締切短縮影響を確認する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPreRegistrationUpdate'}
      responses:
        '200':
          description: 変更前に確認する対象外申込人数。
          content:
            application/json:
              schema:
                type: object
                required: [affected_applicants]
                properties:
                  affected_applicants: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Problem'}
  /settings/pre-registration/activate:
    post:
      operationId: activateAdminPreRegistration
      summary: OPEN後に最大100会員を本登録へ切り替える
      description: 有効なAdmin SessionとOwner/Admin権限、Idempotency-Key、expected_revision必須。現行Admin方針どおり操作ごとの追加Fresh認証は不要。初回実行時に対象・金額・締切を固定。会員ごとに独立commit。未処理を優先し、一時失敗のみ新しい操作で再実行。成功者の日時・付与は不変。同じKeyは元の結果を返す。中断時は同じKeyで再開可。409 PRE_REGISTRATION_NOT_OPEN / PRE_REGISTRATION_REVISION_CONFLICT / IDEMPOTENCY_REQUEST_IN_PROGRESS / IDEMPOTENCY_KEY_REUSED。
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: 個別結果と最新集計。残件は確認後に次の操作で処理する。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPreRegistrationResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{userId}/pre-registration:
    get:
      operationId: getAdminUserPreRegistration
      summary: 会員の事前登録と付与実績を取得する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 電話HMACを含まない会員詳細。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPreRegistrationResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /catalog/gacha-compositions:
    post:
      operationId: createAdminGachaComposition
      summary: 景品構成と設定を一括保存し新しいCanonical Draftを作成する
      description: login系の固定率は十進文字列、小数最大10桁、各率正数、合計100%ちょうど。コピーも表示した入力だけを保存し元ガチャを再読込しない。管理IDの同一Version内重複は409 CATALOG_PRIZE_EXTERNAL_ID_CONFLICT。不正値は422。
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminGachaCompositionSave'}
      responses:
        '201': {description: 新しいガチャ。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCatalogGachaMutationResult'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /catalog/gachas/{gacha_id}/composition:
    get:
      operationId: getAdminGachaComposition
      summary: 同一時点の有効な設定と景品構成を取得する
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/GachaId'}]
      responses:
        '200': {description: 有効な構成。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGachaCompositionResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateAdminGachaComposition
      description: 管理IDの同一Version内重複は409 CATALOG_PRIZE_EXTERNAL_ID_CONFLICT。不正値は422。公開歴のあるGachaの既存非null管理IDの変更・解除は409 CATALOG_PRIZE_EXTERNAL_ID_IMMUTABLE。
      summary: 未公開login Draftの全景品と固定率を一括更新する
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/GachaId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminGachaCompositionUpdate'}
      responses:
        '200': {description: 更新結果。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCatalogGachaMutationResult'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /catalog/gachas/{gacha_id}/copy:
    get:
      operationId: getAdminGachaCopy
      summary: 新規登録画面の未保存コピーを取得する
      description: Draft、Published、Sales Pausedから現在有効な内容を一括取得。期間と識別子は引き継がず、在庫はinitial_inventoryのみ。
      x-idempotency: safe
      x-rate-limit: admin-read
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/GachaId'}]
      responses:
        '200': {description: 未保存prefill。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGachaCompositionResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /catalog/gachas/{gacha_id}/login-inventory/{prize_id}:
    put:
      operationId: updateAdminLoginGachaInventory
      summary: 公開中login景品の利用可能在庫数だけを調整する
      x-idempotency: required
      x-rate-limit: none
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
