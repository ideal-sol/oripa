          type: string
          format: date
        timezone:
          type: string
          const: Asia/Tokyo
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPaymentReversal'
        next_cursor:
          type: [string, 'null']
    ReportingCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
