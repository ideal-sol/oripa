        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateAdminCatalogCategory
      summary: Categoryを更新する
      x-idempotency: required
      x-rate-limit: catalog-mutation
      x-cache-policy: no-store
      x-stability: alpha
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CatalogResourceId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCatalogCategoryUpdate'}
      responses:
        '200': {description: Category更新結果。, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCatalogCategoryMutationResult'}}}}
