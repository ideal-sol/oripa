          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        currency:
          type: string
          const: JPY
        basis:
          type: string
          const: operational_event_aggregation_not_accounting_recognition
        gross_sales:
          $ref: '#/components/schemas/AmountCount'
        refunds:
          $ref: '#/components/schemas/AmountCount'
        chargebacks:
          $ref: '#/components/schemas/AmountCount'
        net_sales_amount:
          type: integer
        chargeback_reversals:
          type: object
          additionalProperties: false
          required: [count]
          properties:
            count:
              type: integer
              minimum: 0
        pending_adjustments:
          type: object
          additionalProperties: false
          required: [count]
          properties:
            count:
              type: integer
              minimum: 0
        days:
          type: array
          items:
            $ref: '#/components/schemas/MonthlySalesDay'
    ReportingCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        date:
          type: string
          format: date
        qa_filter:
          $ref: '#/components/schemas/QaFilter'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, 'null']
    PointReportEntry:
      type: object
