        - free_reserved_balance
        - user_count
        - open_lot_count
        - is_base_date
        - generation_run_id
        - checksum
        - generated_at
      properties:
        snapshot_date:
          type: string
          format: date
        source_cutoff_at:
          type: string
          format: date-time
        closing_paid_balance:
          type: integer
        closing_free_balance:
          type: integer
        paid_reserved_balance:
          type: integer
          minimum: 0
        free_reserved_balance:
          type: integer
          minimum: 0
        user_count:
          type: integer
          minimum: 0
        open_lot_count:
          type: integer
          minimum: 0
        is_base_date:
          type: boolean
        generation_run_id:
