openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Webhook API
  version: 2.0.0-alpha.12
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: 外部Provider向けWebhook API v2。LINE Messaging APIは署名検証済みのfollow／unfollowだけを処理する。
  x-status: alpha
x-oripa-surface: webhook
servers:
  - url: /webhooks/v2
paths:
  /line:
    post:
      operationId: receiveLineMessagingWebhook
      summary: LINE Messaging API Webhookを受信する
      description: >-
        Raw request bodyとX-Line-Signatureを先に検証する。follow／unfollow以外の
        EventはUser Message本文を保存せず無視する。RedeliveryはwebhookEventIdで
        冪等に処理し、Reply Tokenを再利用しない。
      x-idempotency: provider-event-id
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XLineSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookEnvelope'
      responses:
        '200':
          description: 署名済みWebhookを受理した。空Event配列も200を返す。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    OpaqueId:
      $ref: ../components/common.yaml#/schemas/OpaqueId
    SemanticVersion:
      $ref: ../components/common.yaml#/schemas/SemanticVersion
    UtcDateTime:
      $ref: ../components/common.yaml#/schemas/UtcDateTime
    BusinessDate:
      $ref: ../components/common.yaml#/schemas/BusinessDate
    ProblemDetails:
      $ref: ../components/common.yaml#/schemas/ProblemDetails
    LineWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [events]
      properties:
        destination:
          type: string
          maxLength: 128
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineWebhookEvent'
    LineWebhookEvent:
      type: object
      additionalProperties: true
      required: [type, timestamp, source, webhookEventId]
      properties:
        type:
          type: string
          maxLength: 32
        timestamp:
          type: integer
          minimum: 0
        webhookEventId:
          type: string
          minLength: 1
          maxLength: 128
        replyToken:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type:
              type: string
              maxLength: 32
            userId:
              type: string
              minLength: 1
              maxLength: 191
        deliveryContext:
          type: object
          additionalProperties: false
          properties:
            isRedelivery:
              type: boolean
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [accepted, request_id]
      properties:
        accepted:
          const: true
        request_id:
          $ref: '#/components/schemas/OpaqueId'
  parameters:
    XLineSignature:
      name: X-Line-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    XRequestId:
      $ref: ../components/common.yaml#/headers/XRequestId
    XOripaApiVersion:
      $ref: ../components/common.yaml#/headers/XOripaApiVersion
    RetryAfter:
      $ref: ../components/common.yaml#/headers/RetryAfter
  responses:
    Problem:
      $ref: ../components/common.yaml#/responses/Problem
