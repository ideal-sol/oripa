openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Webhook API
  version: 2.0.0-alpha.23
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: 外部Provider向けWebhook API v2。LINE Messaging APIは署名検証済みのfollow／unfollowだけを処理する。
  x-status: alpha
x-oripa-surface: webhook
servers:
  - url: /webhooks/v2
paths:
  /line:
    post:
      operationId: receiveLineMessagingWebhook
      summary: LINE Messaging API Webhookを受信する
      description: >-
        Raw request bodyとX-Line-Signatureを先に検証する。follow／unfollow以外の
        EventはUser Message本文を保存せず無視する。RedeliveryはwebhookEventIdで
        冪等に処理し、Reply Tokenを再利用しない。
      x-idempotency: provider-event-id
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XLineSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookEnvelope'
      responses:
        '200':
          description: 署名済みWebhookを受理した。空Event配列も200を返す。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /fincode:
    post:
      operationId: receiveFincodePaymentWebhook
      summary: fincode Payment Webhookを受信する
      description: >-
        Fincode-Signatureを登録済みsignatureと定数時間比較し、EventのPayment参照と
        pay_typeを照合した後、fincode Payment取得APIのCanonical statusを確認する。
        Browser returnやWebhook payload単独ではPayment Successを確定しない。
      x-idempotency: canonical-event-fingerprint
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/FincodeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FincodePaymentWebhook'
      responses:
        '200':
          description: 検証済みEventを処理、重複処理、または安全に無視した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FincodeWebhookAccepted'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    OpaqueId:
      $ref: ../components/common.yaml#/schemas/OpaqueId
    SemanticVersion:
      $ref: ../components/common.yaml#/schemas/SemanticVersion
    UtcDateTime:
      $ref: ../components/common.yaml#/schemas/UtcDateTime
    BusinessDate:
      $ref: ../components/common.yaml#/schemas/BusinessDate
    ProblemDetails:
      $ref: ../components/common.yaml#/schemas/ProblemDetails
    LineWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [events]
      properties:
        destination:
          type: string
          maxLength: 128
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineWebhookEvent'
    LineWebhookEvent:
      type: object
      additionalProperties: true
      required: [type, timestamp, source, webhookEventId]
      properties:
        type:
          type: string
          maxLength: 32
        timestamp:
          type: integer
          minimum: 0
        webhookEventId:
          type: string
          minLength: 1
          maxLength: 128
        replyToken:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type:
              type: string
              maxLength: 32
            userId:
              type: string
              minLength: 1
              maxLength: 191
        deliveryContext:
          type: object
          additionalProperties: false
          properties:
            isRedelivery:
              type: boolean
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [accepted, request_id]
      properties:
        accepted:
          const: true
        request_id:
          $ref: '#/components/schemas/OpaqueId'
    FincodePaymentWebhook:
      type: object
      additionalProperties: true
      required: [event, pay_type, status]
      anyOf:
        - required: [order_id]
        - required: [id]
      properties:
        event:
          type: string
          minLength: 1
          maxLength: 64
        order_id:
          type: string
          minLength: 1
          maxLength: 30
        id:
          type: string
          minLength: 1
          maxLength: 30
        pay_type:
          enum: [Card, Paypay, Konbini, Virtualaccount]
        status:
          enum: [UNPROCESSED, CHECKED, AUTHORIZED, AWAITING_CUSTOMER_PAYMENT, AWAITING_PAYMENT_APPROVAL, CAPTURED, CANCELED, EXPIRED, AUTHENTICATED, FAILED]
    FincodeWebhookAccepted:
      type: object
      additionalProperties: false
      required: [receive]
      properties:
        receive:
          const: '0'
  parameters:
    XLineSignature:
      name: X-Line-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    FincodeSignature:
      name: Fincode-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  headers:
    XRequestId:
      $ref: ../components/common.yaml#/headers/XRequestId
    XOripaApiVersion:
      $ref: ../components/common.yaml#/headers/XOripaApiVersion
    RetryAfter:
      $ref: ../components/common.yaml#/headers/RetryAfter
  responses:
    Problem:
      $ref: ../components/common.yaml#/responses/Problem
