openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Oripa Webhook API
  version: 2.0.0-alpha.41
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: 外部Provider向けWebhook API v2。LINE Messaging APIは署名検証済みのfollow／unfollowだけを処理する。
  x-status: alpha
x-oripa-surface: webhook
servers:
  - url: /webhooks/v2
paths:
  /univapay/{token}:
    post:
      operationId: receiveUnivapayWebhook
      summary: UnivaPay通知を永続Outboxへ受け付ける
      description: Path tokenとAuthorizationを定数時間比較。任意IP制限。HTTP内ではProvider照会・付与を行わず3秒以内の200応答を目標とする。永続化失敗は503。生本文は保存しない。
      x-idempotency: provider-event-id
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 32}
        - name: Authorization
          in: header
          required: true
          schema: {type: string, minLength: 32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                id: {type: string, format: uuid}
                event: {type: string}
                data: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Durable acceptance or minimal ignored receipt. No settlement authority from request body.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted]
                properties:
                  accepted: {const: true}
        '401': {description: Invalid authorization or optional source IP restriction.}
        '404': {description: Invalid path token.}
        '503': {description: Durable acceptance failed; retry required.}
        default: {$ref: '#/components/responses/Problem'}
  /paidy/{token}:
    post:
      operationId: receivePaidyPaymentWebhook
      summary: Paidy通知の最小キーを永続Outboxに受理する
      description: パストークン不一致404。本文は信用せずworkerのRetrieveだけで判定。未知通知も最小受信記録、永続化失敗503。同期Provider通信なし。
      x-idempotency: canonical-event-fingerprint
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: {type: string, minLength: 32, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                payment_id: {type: string, maxLength: 128}
                event_type: {type: string}
                status: {type: string}
                order_ref: {type: string}
                timestamp: {type: string}
      responses:
        '200':
          description: 耐久的に受理済み。決済成功を意味しない。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAccepted'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /line:
    post:
      operationId: receiveLineMessagingWebhook
      summary: LINE Messaging API Webhookを受信する
      description: >-
        Raw request bodyとX-Line-Signatureを先に検証する。follow／unfollow以外の
        EventはUser Message本文を保存せず無視する。RedeliveryはwebhookEventIdで
        冪等に処理し、Reply Tokenを再利用しない。
      x-idempotency: provider-event-id
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/XLineSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookEnvelope'
      responses:
        '200':
          description: 署名済みWebhookを受理した。空Event配列も200を返す。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /fincode:
    post:
      operationId: receiveFincodePaymentWebhook
      summary: fincode PaymentまたはCard Registration Webhookを受信する
      description: >-
        Fincode-Signatureを登録済みsignatureと定数時間比較する。Payment Eventはfincode Payment exact GETを、
        customers.payment_methods.updatedはCard Registration相関triggerとしてPayment Method exact GETとCard exact GETを行う。
        Browser ReturnやWebhook payload単独ではPayment成功またはCard保存成功を確定しない。
      x-idempotency: canonical-event-fingerprint
      x-rate-limit: provider-signed-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - $ref: '#/components/parameters/FincodeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FincodeWebhook'
      responses:
        '200':
          description: 検証済みEventを処理、重複処理、または安全に無視した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FincodeWebhookAccepted'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /techcoin/{token}:
    post:
      operationId: receiveTechcoinPaymentKickback
      summary: Techcoin NetRideCashの署名なしキックバックを照合する
      description: URL token、任意設定の送信元IP、保存済みPaymentのcookie・会員sendid・10055・整数JPY額・取引IDの未使用をすべて照合する。期限後・terminal・不一致成功は付与せず要確認。DB失敗はロールバックして500。Provider原時刻は提供されず、成立時刻はサーバー検証受信時刻。
      x-idempotency: payment-cookie-and-provider-reference
      x-rate-limit: provider-token-webhook
      x-cache-policy: no-store
      x-stability: alpha
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 32, maxLength: 256}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TechcoinKickback'
          application/json:
            schema:
              $ref: '#/components/schemas/TechcoinKickback'
      responses:
        '200':
          description: コミット済み、同一再送、または付与せず要確認へ記録した。空本文。
        '403':
          description: 設定済み送信元制限に一致しない。
        '404':
          description: URL token不一致。
        '413':
          description: 通知サイズ超過。
        '422':
          description: 通知の符号化形式が不正。
        '500':
          description: 処理失敗。金融トランザクションはロールバック済み。再送条件T4は運用確認が必要。
components:
  schemas:
    TechcoinKickback:
      type: object
      additionalProperties: false
      required: [cookie, sendid, price, rel, payment_code]
      properties:
        cookie: {type: string, pattern: '^[0-9a-f]{32}$'}
        sendid: {type: string, pattern: '^[a-z0-9]{1,30}$'}
        sendpoint: {type: string, maxLength: 150, description: Optional reference only. Never grants authority or selects a URL.}
        price:
          oneOf:
            - {type: string, pattern: '^[1-9][0-9]{0,5}$'}
            - {type: integer, minimum: 1, maximum: 999999}
        rel:
          oneOf:
            - {type: string, enum: ['0', '1']}
            - {type: integer, enum: [0, 1]}
        payment_code:
          oneOf:
            - {const: '10055'}
            - {const: 10055}
        order_cpt: {type: string, pattern: '^[A-Za-z0-9_-]{1,191}$', description: Optional provider reference; absence uses the immutable cookie.}
    OpaqueId:
      $ref: ../components/common.yaml#/schemas/OpaqueId
    SemanticVersion:
      $ref: ../components/common.yaml#/schemas/SemanticVersion
    UtcDateTime:
      $ref: ../components/common.yaml#/schemas/UtcDateTime
    BusinessDate:
      $ref: ../components/common.yaml#/schemas/BusinessDate
    ProblemDetails:
      $ref: ../components/common.yaml#/schemas/ProblemDetails
    LineWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [events]
      properties:
        destination:
          type: string
          maxLength: 128
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineWebhookEvent'
    LineWebhookEvent:
      type: object
      additionalProperties: true
      required: [type, timestamp, source, webhookEventId]
      properties:
        type:
          type: string
          maxLength: 32
        timestamp:
          type: integer
          minimum: 0
        webhookEventId:
          type: string
          minLength: 1
          maxLength: 128
        replyToken:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type:
              type: string
              maxLength: 32
            userId:
              type: string
              minLength: 1
              maxLength: 191
        deliveryContext:
          type: object
          additionalProperties: false
          properties:
            isRedelivery:
              type: boolean
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [accepted, request_id]
      properties:
        accepted:
          const: true
        request_id:
          $ref: '#/components/schemas/OpaqueId'
    FincodePaymentWebhook:
      type: object
      additionalProperties: true
      required: [event, pay_type, status]
      anyOf:
        - required: [order_id]
        - required: [id]
      properties:
        event:
          type: string
          minLength: 1
          maxLength: 64
        order_id:
          type: string
          minLength: 1
          maxLength: 30
        id:
          type: string
          minLength: 1
          maxLength: 30
        pay_type:
          enum: [Card, Paypay, Konbini, Virtualaccount]
        status:
          enum: [UNPROCESSED, CHECKED, AUTHORIZED, AWAITING_CUSTOMER_PAYMENT, AWAITING_PAYMENT_APPROVAL, CAPTURED, CANCELED, EXPIRED, AUTHENTICATED, FAILED]
    FincodeCardRegistrationWebhook:
      type: object
      additionalProperties: true
      required: [event, pay_type, card_status, status, access_id]
      properties:
        event:
          const: customers.payment_methods.updated
          description: Redirect型Card Registration結果通知に必要なfincode公式Event。
        pay_type:
          const: Card
        card_status:
          enum: [INACTIVATED, AWAITING_CUSTOMER_ACTION, ACTIVATED, FAILED]
        customer_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
        card_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: signed correlation candidate。Card保存Authorityではなく、Card exact GETで再確認する。
        process_type:
          enum: [I, U]
        status:
          enum: [AUTHENTICATING, CHALLENGE, AUTHENTICATED, CHECK]
          description: Provider notification only; registration proof requires canonical Method and Card exact GETs.
        access_id:
          type: string
          minLength: 1
          maxLength: 128
        transaction_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: Optional metadata, not correlation authority. Missing or null does not erase a stored transaction reference.
        client_field_1:
          description: Platform Public Opaque Card Registration.id。nullable時はaccess_idで相関する。
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OpaqueId'
        error_code:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
    FincodeWebhook:
      oneOf:
        - $ref: '#/components/schemas/FincodePaymentWebhook'
        - $ref: '#/components/schemas/FincodeCardRegistrationWebhook'
    FincodeWebhookAccepted:
      type: object
      additionalProperties: false
      required: [receive]
      properties:
        receive:
          const: '0'
  parameters:
    XLineSignature:
      name: X-Line-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    FincodeSignature:
      name: Fincode-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  headers:
    XRequestId:
      $ref: ../components/common.yaml#/headers/XRequestId
    XOripaApiVersion:
      $ref: ../components/common.yaml#/headers/XOripaApiVersion
    RetryAfter:
      $ref: ../components/common.yaml#/headers/RetryAfter
  responses:
    Problem:
      $ref: ../components/common.yaml#/responses/Problem
